[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glycontact"
version = "0.5.0"
description = "A Python package for processing and analyzing glycan 3D structures"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Luc Thomes", email = "luc.thomes@univ-lille.fr"}, {name = "Daniel Bojar", email = "daniel.bojar@gu.se"}
]
keywords = ["glycans", "bioinformatics", "structural biology", "PDB"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "plotly",
    "requests",
    "mdtraj>=1.10.1",
    "glycowork>=1.10.0",
    "ipython",
    "imageio",
    "py3Dmol",
    "tqdm",
    "scikit-learn"
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/BojarLab/glycontact"
Repository = "https://github.com/BojarLab/glycontact"
Documentation = "https://github.com/BojarLab/glycontact#readme"

[tool.hatch.build.targets.wheel]
packages = ["glycontact"]

[tool.hatch.build.targets.wheel.force-include]
"glycontact/20260929_GLYCOSHAPE.json" = "glycontact/20260929_GLYCOSHAPE.json"
"glycontact/glycan_graphs.pkl" = "glycontact/glycan_graphs.pkl"
"glycontact/unilectin_data.json" = "glycontact/unilectin_data.json"

[tool.hatch.metadata]
allow-direct-references = true